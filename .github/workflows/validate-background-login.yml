name: Build signed Android update (background and login fixes)

on:
  push:
    branches:
      - fix/background-notifications-masterflix-login
    paths:
      - ".github/workflows/validate-background-login.yml"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK for in-place update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/background-notifications-masterflix-login

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate permanent signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Prepare same release signing key and higher version code
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/master-responde-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/master-responde-release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify package and APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: master-responde-background-login-signed-update
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
