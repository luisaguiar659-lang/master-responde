name: MASTER RESPONDE - Build APK para a conversa

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar e publicar APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Validar estrutura do projeto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Compilar APK de instalação (debug)
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Validar APK gerado
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo 'APK gerado com sucesso:'
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Publicar APK para download na conversa
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-RESPONDE-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
