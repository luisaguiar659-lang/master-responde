      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q MASTER-RESPONDE-v1.17.7-FIX-COPIAR.zip -d projeto
          echo "=== ESTRUTURA EXTRAÍDA ==="
          find projeto -maxdepth 4 -type f -name "gradlew" -print

      - name: Compilar APK release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/master-responde-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GRADLEW=$(find projeto -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado dentro do projeto."
            find projeto -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Projeto Android encontrado em: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Preparar APK
        run: |
          APK=$(find projeto -type f -path "*/build/outputs/apk/release/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" MASTER-RESPONDE-v1.17.7.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-RESPONDE-v1.17.7
          path: MASTER-RESPONDE-v1.17.7.apk
