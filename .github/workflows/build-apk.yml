name: Build MASTER RESPONDE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q master-responde-v1.8.11.zip -d projeto
      - name: Compilar APK
        working-directory: projeto/master-responde-android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp projeto/master-responde-android-native/app/build/outputs/apk/debug/app-debug.apk MASTER-RESPONDE.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-RESPONDE-APK
          path: MASTER-RESPONDE.apk
