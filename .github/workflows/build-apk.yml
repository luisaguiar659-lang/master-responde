name: Build MASTER RESPONDE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: configure os 4 GitHub Secrets de assinatura antes de compilar."
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q MASTER-RESPONDE-v1.17.18-MENU-NUMERICO.zip -d projeto

      - name: Verificar projeto extraído
        run: |
          echo "=== Estrutura do projeto ==="
          find projeto -maxdepth 3 -type f | head -100

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/master-responde-release.jks"

      - name: Compilar APK release
        working-directory: projeto/master-responde-v1.17.18
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/master-responde-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Localizar APK gerado
        run: |
          echo "=== APKs encontrados ==="
          find projeto -type f -name "*.apk" -print

      - name: Preparar APK
        run: |
          APK=$(find projeto/master-responde-v1.17.18/app/build/outputs/apk/release -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" MASTER-RESPONDE-v1.17.18.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-RESPONDE-v1.17.18
          path: MASTER-RESPONDE-v1.17.18.apk
          if-no-files-found: error
