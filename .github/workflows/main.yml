name: Build MASTER RESPONDE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "MASTER-RESPONDE-RAIZ.zip"
      - "patches/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: configure os 4 GitHub Secrets de assinatura antes de compilar."
            exit 1
          fi

      - name: Extrair projeto
        run: |
          test -f MASTER-RESPONDE-RAIZ.zip
          rm -rf projeto
          mkdir -p projeto
          unzip -q MASTER-RESPONDE-RAIZ.zip -d projeto

      - name: Aplicar correções v2.0.3 até v2.0.7
        run: |
          cat patches/v2.0.3/part-*.patch > "$RUNNER_TEMP/v203.patch"
          (cd projeto && patch -p1 --forward --batch < "$RUNNER_TEMP/v203.patch")
          cat patches/v2.0.4/part-*.patch > "$RUNNER_TEMP/v204.patch"
          (cd projeto && patch -p1 --forward --batch < "$RUNNER_TEMP/v204.patch")
          for v in v2.0.5 v2.0.6 v2.0.7; do
            cat patches/$v/*.patch > "$RUNNER_TEMP/$v.patch"
            (cd projeto && patch -p1 --forward --batch < "$RUNNER_TEMP/$v.patch")
          done

      - name: Aplicar v2.0.8 — somente WhatsApp Business
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('projeto/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r"versionCode\s+68\b", "versionCode 69", text, count=1)
          text = re.sub(r"versionName\s+'2\.0\.7'", "versionName '2.0.8'", text, count=1)
          gradle.write_text(text, encoding='utf-8')

          svc = Path('projeto/app/src/main/java/com/masterresponde/app/NotificationAccessService.java')
          text = svc.read_text(encoding='utf-8')

          const_line = '    private static final String WHATSAPP_BUSINESS = "com.whatsapp.w4b";\n'
          if 'private static final String WHATSAPP_BUSINESS = "com.whatsapp.w4b";' not in text:
              marker = '    private final Handler handler = new Handler(Looper.getMainLooper());\n'
              if marker not in text:
                  raise SystemExit('ERRO: ponto de inserção da constante não encontrado')
              text = text.replace(marker, marker + '\n' + const_line, 1)

          guard = '''        if (sbn == null\n                || !WHATSAPP_BUSINESS.equals(sbn.getPackageName())) {\n            return;\n        }\n\n'''

          if '!WHATSAPP_BUSINESS.equals(sbn.getPackageName())' not in text:
              pattern = r'(public\s+void\s+onNotificationPosted\s*\(\s*StatusBarNotification\s+sbn\s*\)\s*\{\s*\n)'
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit('ERRO: método onNotificationPosted(StatusBarNotification sbn) não encontrado')
              text = text[:m.end()] + guard + text[m.end():]

          svc.write_text(text, encoding='utf-8')
          PY

          grep -n "versionName '2.0.8'" projeto/app/build.gradle
          grep -n 'WHATSAPP_BUSINESS = "com.whatsapp.w4b"' projeto/app/src/main/java/com/masterresponde/app/NotificationAccessService.java
          grep -n '!WHATSAPP_BUSINESS.equals(sbn.getPackageName())' projeto/app/src/main/java/com/masterresponde/app/NotificationAccessService.java

      - name: Detectar diretório Gradle
        id: project
        shell: bash
        run: |
          SETTINGS=$(find projeto \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -type f | head -1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/master-responde-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

      - name: Compilar APK release
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/master-responde-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Preparar APK final
        run: |
          APK=$(find projeto -type f -path "*/app/build/outputs/apk/release/*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find projeto -type f -path "*/app/build/outputs/apk/release/*.apk" | head -1)
          fi
          test -n "$APK"
          cp "$APK" MASTER-RESPONDE.apk
          ls -lh MASTER-RESPONDE.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-RESPONDE-v2.0.8
          path: MASTER-RESPONDE.apk
          if-no-files-found: error
          retention-days: 30
