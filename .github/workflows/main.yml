name: Build MASTER RESPONDE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "app/**"
      - "patches/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Integrar Master IBO
        run: |
          python3 patches/v2.1.0/add_master_ibo_integration.py || true
          python3 patches/v2.1.0/add_master_ibo_command_router.py || true

      - name: Validar projeto Android
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          echo "Projeto Android encontrado"

      - name: Compilar APK Release
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: master-responde-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
